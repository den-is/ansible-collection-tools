- name: Check if binary already exists in $PATH
  ansible.builtin.shell: command -v {{ fnm_bin }}
  register: _fnm_bin_exists
  ignore_errors: true
  changed_when: false

- name: Get installed version if any
  ansible.builtin.shell: "{{ fnm_bin }} --version | grep -E -o '[0-9]+\\.[0-9]+\\.[0-9]+'"
  register: _check_fnm_v_task
  ignore_errors: true
  changed_when: false

- name: Get default Node.js version if installed
  ansible.builtin.shell: "{{ fnm_bin }} exec --using=default node --version | grep -E -o 'v[0-9]+\\.[0-9]+\\.[0-9]+'"
  register: _check_node_v_task
  ignore_errors: true
  changed_when: false
  when: _check_fnm_v_task is success

- name: Get default npm version if installed
  ansible.builtin.shell: "{{ fnm_bin }} exec --using=default npm --version | grep -E -o '[0-9]+\\.[0-9]+\\.[0-9]+'"
  register: _check_npm_v_task
  ignore_errors: true
  changed_when: false
  when: _check_fnm_v_task is success

- name: Register preflight facts
  ansible.builtin.set_fact:
    _installed_fnm_v: "{{ _check_fnm_v_task.stdout | default('0.0.0', true) }}"

- name: Reporting installed version
  ansible.builtin.debug:
    msg: |-
      Installed version: {{ _installed_fnm_v if _check_fnm_v_task is success else "Not Found" }}
      Installed Node version: {{ _check_node_v_task.stdout if _check_node_v_task is success else "Not Found" }}
      Installed npm version: {{ _check_npm_v_task.stdout if _check_npm_v_task is success else "Not Found" }}
