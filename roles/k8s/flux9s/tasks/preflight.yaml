- name: Check if binary already exists in $PATH
  ansible.builtin.shell: 'command -v {{ flux9s_bin }}'
  register: flux9s_bin_exists
  ignore_errors: true
  changed_when: false

- name: Get installed version if any
  ansible.builtin.shell: flux9s --version | grep -E -o "[0-9]+\.[0-9]+\.[0-9]+"
  register: _check_flux9s_v_task
  ignore_errors: true
  changed_when: false

- name: Register preflight facts
  ansible.builtin.set_fact:
    _installed_flux9s_v: "{{ _check_flux9s_v_task.stdout | default('0.0.0', true) }}"

- name: Reporting installed version
  ansible.builtin.debug:
    msg: 'Installed version: {{ _installed_flux9s_v if _check_flux9s_v_task is success else "Not Found" }}'
